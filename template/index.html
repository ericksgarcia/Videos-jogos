<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Barlow"; font-weight: 500; src: url("assets/barlow-500.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/barlow-700.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 800; src: url("assets/barlow-800.woff2") format("woff2"); }
      :root {
        --bg: #070a10;
        --texto: #f4f4f5;
        --suave: #a1a1aa;
        --linha: rgba(255, 255, 255, 0.14);
        --casa: #ffffff;
        --fora: #facc15;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
        font-family: "Barlow", "Liberation Sans", sans-serif; color: var(--texto);
      }
      .camada { position: absolute; inset: 0; pointer-events: none; }

      /* ---------- fundo vivo ---------- */
      .blob { position: absolute; width: 1500px; height: 1500px; border-radius: 50%; }
      #b1 { left: -700px; top: -600px; background: radial-gradient(closest-side, color-mix(in srgb, var(--casa) 30%, transparent), transparent); }
      #b2 { left: 300px; top: 1000px; background: radial-gradient(closest-side, color-mix(in srgb, var(--fora) 30%, transparent), transparent); }
      #b3 { left: 100px; top: 300px; width: 1100px; height: 1100px; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.05), transparent); }
      #campo { position: absolute; left: -200px; top: 200px; width: 1480px; height: 1800px; opacity: 0.07; }
      #faixas { position: absolute; inset: 0; overflow: hidden; }
      .raio { position: absolute; top: -400px; width: 160px; height: 2800px; transform: rotate(18deg); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent); }

      #camera { position: absolute; inset: 0; transform-origin: 540px 900px; }
      .cena { position: absolute; inset: 0; opacity: 0; }
      .escudo { width: 100%; height: 100%; object-fit: contain; }
      .escudo-alt { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.32em; background: var(--linha); }
      .mascara { overflow: hidden; display: block; }
      .mascara > * { display: block; }

      #flash { position: absolute; inset: 0; opacity: 0; background: #fff; }
      #vermelho { position: absolute; inset: 0; opacity: 0; background: radial-gradient(closest-side, transparent 55%, rgba(239, 68, 68, 0.75)); transform: scale(1.4); }
      #wipe { position: absolute; inset: 0; overflow: hidden; }
      .painel { position: absolute; top: -200px; left: 0; width: 1500px; height: 2400px; transform: translateX(-2600px) skewX(-14deg); }
      #grao {
        position: absolute; inset: 0; opacity: 0.09; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>");
      }
      #vinheta { position: absolute; inset: 0; background: radial-gradient(130% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.65)); }
      #progresso { position: absolute; left: 0; top: 0; width: 1080px; height: 10px; background: linear-gradient(90deg, var(--casa), var(--fora)); transform-origin: left center; transform: scaleX(0); }

      /* ---------- gancho ---------- */
      #gancho { display: flex; flex-direction: column; justify-content: center; padding: 0 80px 300px; transform-origin: 300px 900px; }
      #gancho .laje { position: absolute; left: -100px; top: 640px; width: 1300px; height: 520px; transform-origin: left center; transform: skewY(-7deg); background: linear-gradient(90deg, color-mix(in srgb, var(--casa) 30%, transparent), color-mix(in srgb, var(--fora) 30%, transparent)); }
      #gancho .tag { position: relative; font-weight: 700; font-size: 46px; letter-spacing: 0.14em; color: var(--suave); text-transform: uppercase; }
      #gancho h1 { position: relative; font-weight: 800; font-size: 190px; line-height: 0.9; margin: 26px 0 40px; text-transform: uppercase; }
      #gancho h1 .w { display: inline-block; margin-right: 0.18em; transform-origin: center 60%; }
      #gancho .eco { position: absolute; left: 80px; top: 0; bottom: 300px; display: flex; align-items: center; font-weight: 800; font-size: 190px; line-height: 0.9; text-transform: uppercase; color: transparent; -webkit-text-stroke: 3px rgba(255, 255, 255, 0.18); opacity: 0; transform-origin: left center; }
      #gancho p { position: relative; font-weight: 500; font-size: 58px; line-height: 1.15; color: #d4d4d8; }

      /* ---------- intro ---------- */
      #intro { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 260px; }
      #intro .duelo { position: relative; display: flex; align-items: center; gap: 50px; }
      #intro .time { width: 340px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
      #intro .time .img { width: 290px; height: 290px; font-size: 290px; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6)); }
      #intro .time .nome { font-weight: 800; font-size: 78px; text-transform: uppercase; text-align: center; line-height: 1; }
      #intro .vs { position: relative; font-weight: 800; font-size: 120px; font-style: italic; color: var(--texto); text-shadow: 0 0 40px rgba(255, 255, 255, 0.5); }
      #intro .anel { position: absolute; left: 50%; top: 50%; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%; border: 8px solid #fff; opacity: 0; }
      #intro .brilho { position: absolute; top: -120px; left: -300px; width: 220px; height: 700px; transform: rotate(20deg); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent); opacity: 0; mix-blend-mode: overlay; }
      #intro .info { margin-top: 90px; text-align: center; position: relative; }
      #intro .info .fita { height: 8px; width: 520px; margin: 0 auto 26px; background: linear-gradient(90deg, var(--casa), var(--fora)); transform: scaleX(0); }
      #intro .info .comp { font-weight: 700; font-size: 52px; letter-spacing: 0.08em; text-transform: uppercase; }
      #intro .info .local { font-weight: 500; font-size: 44px; color: var(--suave); margin-top: 12px; }
      #intro .rolando { position: relative; margin-top: 70px; font-weight: 800; font-size: 56px; letter-spacing: 0.1em; padding: 20px 48px; border-radius: 999px; background: var(--texto); color: var(--bg); opacity: 0; }
      #intro .rolando .pulso { position: absolute; inset: 0; border-radius: 999px; border: 5px solid var(--texto); opacity: 0; }

      /* ---------- principal ---------- */
      #placar { position: absolute; top: 170px; left: 60px; width: 880px; height: 270px; display: flex; align-items: center; justify-content: space-between; }
      #placar .lado { width: 220px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      #placar .lado .img { width: 150px; height: 150px; font-size: 150px; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5)); }
      #placar .lado .sigla { font-weight: 800; font-size: 52px; letter-spacing: 0.06em; }
      #placar .centro { display: flex; flex-direction: column; align-items: center; }
      #placar .nums { display: flex; align-items: center; gap: 28px; font-weight: 800; font-size: 190px; line-height: 1; }
      #placar .num { position: relative; width: 110px; height: 190px; overflow: hidden; }
      #placar .num span { position: absolute; inset: 0; text-align: center; opacity: 0; }
      #placar .num span:first-child { opacity: 1; }
      #placar .traco { color: var(--suave); font-size: 120px; }
      #relogio { position: relative; width: 220px; height: 76px; margin-top: 10px; border-radius: 38px; background: rgba(255, 255, 255, 0.12); border: 2px solid var(--linha); }
      #relogio span { position: absolute; inset: 0; text-align: center; line-height: 72px; font-weight: 700; font-size: 50px; opacity: 0; }
      #relogio .ao-vivo { position: absolute; left: 22px; top: 30px; width: 14px; height: 14px; border-radius: 50%; background: #ef4444; }

      #gigante { position: absolute; left: 0; top: 520px; width: 1080px; text-align: center; font-weight: 800; font-size: 560px; line-height: 1; color: transparent; -webkit-text-stroke: 6px var(--cor, #fff); opacity: 0; transform-origin: 50% 50%; }
      #palco { position: absolute; top: 500px; left: 60px; width: 880px; height: 680px; perspective: 1600px; }
      .card {
        position: absolute; inset: 0; opacity: 0; border-radius: 40px; padding: 52px 56px; overflow: hidden;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
        border: 2px solid rgba(255, 255, 255, 0.16); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        display: flex; flex-direction: column; transform-origin: 50% 60%;
      }
      .card .faixa-cor { position: absolute; left: 0; top: 0; bottom: 0; width: 18px; background: var(--cor); transform-origin: top; }
      .card .reflexo { position: absolute; top: -200px; left: -400px; width: 260px; height: 1200px; transform: rotate(22deg); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), transparent); }
      .card .topo { position: relative; display: flex; align-items: center; gap: 30px; }
      .card .icone { width: 120px; height: 120px; flex: none; }
      .card { --cor-txt: color-mix(in srgb, var(--cor) 62%, #ffffff); }
      .card .min { font-weight: 800; font-size: 120px; line-height: 1; color: var(--cor-txt); }
      .card .esc { margin-left: auto; width: 130px; height: 130px; font-size: 130px; }
      .card .rot-box { position: relative; margin-top: 26px; height: 150px; }
      .card .rotulo { position: absolute; left: 0; top: 0; font-weight: 800; font-size: 150px; line-height: 1; text-transform: uppercase; white-space: nowrap; }
      .card .rotulo.c1 { color: var(--cor); mix-blend-mode: screen; opacity: 0; }
      .card .rotulo.c2 { color: #22d3ee; mix-blend-mode: screen; opacity: 0; }
      .card.longo .rot-box { height: 116px; }
      .card.longo .rotulo { font-size: 112px; }
      .card .jogador { font-weight: 700; font-size: 82px; line-height: 1.1; margin-top: 14px; }
      .card .detalhe { font-weight: 500; font-size: 48px; color: var(--suave); margin-top: 8px; }
      .card .rodape { margin-top: auto; display: flex; align-items: center; gap: 24px; font-weight: 800; font-size: 76px; position: relative; }
      .card .rodape .s { color: var(--suave); }
      .card .rodape .marcou { color: var(--cor-txt); }
      .card .medidor { flex: 1; }
      .card .medidor .rot { font-weight: 700; font-size: 40px; color: var(--suave); text-transform: uppercase; letter-spacing: 0.06em; }
      .card .medidor .trilho { position: relative; height: 30px; border-radius: 15px; background: var(--linha); margin-top: 14px; overflow: hidden; }
      .card .medidor .enche { position: absolute; inset: 0; background: var(--cor); box-shadow: 0 0 30px var(--cor); transform-origin: left center; transform: scaleX(0); }
      .card .pct { position: relative; width: 150px; height: 80px; font-size: 76px; }
      .card .pct span { position: absolute; right: 0; top: 0; opacity: 0; }
      .cartao { position: absolute; right: 70px; top: 230px; width: 200px; height: 290px; border-radius: 22px; opacity: 0; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); }
      .cartao::after { content: ""; position: absolute; inset: 0; border-radius: 22px; background: linear-gradient(135deg, rgba(255, 255, 255, 0.45), transparent 45%); }

      #particulas { position: absolute; inset: 0; }
      .conf { position: absolute; left: 540px; top: 840px; width: 22px; height: 34px; border-radius: 4px; opacity: 0; }
      .onda { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 6px solid var(--cor); opacity: 0; }

      #barra { position: absolute; top: 1190px; left: 80px; width: 840px; height: 420px; }
      #marcas { position: absolute; left: 0; top: 0; width: 840px; height: 150px; }
      .marca { position: absolute; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%; background: var(--bg); border: 5px solid var(--cor); padding: 9px; opacity: 0; box-shadow: 0 0 24px color-mix(in srgb, var(--cor) 60%, transparent); }
      .marca.r0 { top: 82px; }
      .marca.r1 { top: 6px; }
      .marca .haste { position: absolute; left: 50%; top: 59px; width: 4px; margin-left: -2px; background: var(--cor); opacity: 0.6; }
      .marca.r0 .haste { height: 14px; }
      .marca.r1 .haste { height: 90px; }
      #trilho { position: absolute; left: 0; top: 160px; width: 840px; height: 22px; border-radius: 11px; background: var(--linha); overflow: hidden; }
      #enche { position: absolute; inset: 0; background: linear-gradient(90deg, var(--casa), var(--fora)); transform-origin: left center; transform: scaleX(0); }
      #cabeca { position: absolute; left: 0; top: 171px; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: #fff; box-shadow: 0 0 30px 10px rgba(255, 255, 255, 0.55); }
      .tique { position: absolute; top: 152px; width: 4px; height: 38px; margin-left: -2px; background: var(--texto); opacity: 0.5; }
      .rot-t { position: absolute; top: 200px; font-weight: 700; font-size: 38px; color: var(--suave); transform: translateX(-50%); }
      #momentum { position: absolute; left: 0; top: 260px; width: 840px; height: 160px; }
      #mom-revela { position: absolute; left: 0; top: 0; height: 160px; width: 0; overflow: hidden; }
      #momentum svg { position: absolute; left: 0; top: 0; }
      #momentum .eixo { position: absolute; left: 0; top: 79px; width: 840px; height: 2px; background: var(--linha); }
      #momentum .leg { position: absolute; left: -64px; width: 44px; height: 44px; font-size: 44px; }

      /* ---------- fim ---------- */
      #fim { display: flex; flex-direction: column; align-items: center; padding: 190px 80px 0; }
      #fim .titulo { font-weight: 800; font-size: 96px; letter-spacing: 0.08em; padding: 6px 36px; border: 8px solid var(--texto); border-radius: 18px; transform: rotate(-3deg); }
      #fim .final { display: flex; align-items: center; gap: 40px; margin-top: 60px; }
      #fim .final .img { width: 200px; height: 200px; font-size: 200px; }
      #fim .final .gols { font-weight: 800; font-size: 230px; line-height: 1; display: flex; gap: 30px; }
      #fim .final .gols .x { color: var(--suave); }
      #fim .stats { width: 860px; margin-top: 60px; display: flex; flex-direction: column; gap: 32px; }
      #fim .linha .nums { display: flex; justify-content: space-between; font-weight: 800; font-size: 58px; }
      #fim .linha .nums .nome { font-weight: 700; font-size: 40px; color: var(--suave); text-transform: uppercase; letter-spacing: 0.06em; align-self: center; }
      #fim .linha .barras { display: flex; gap: 10px; height: 18px; margin-top: 8px; }
      #fim .linha .barras div { height: 100%; border-radius: 9px; transform: scaleX(0); }
      #fim .linha .barras .bc { background: var(--casa); transform-origin: right center; }
      #fim .linha .barras .bf { background: var(--fora); transform-origin: left center; }
      #fim .cta { margin-top: 60px; display: flex; align-items: center; gap: 26px; font-weight: 700; font-size: 48px; line-height: 1.15; padding: 26px 44px; border-radius: 30px; background: rgba(255, 255, 255, 0.1); border: 3px solid var(--linha); opacity: 0; }
      #fim .cta b { font-weight: 800; }
      #fim .cta .seta { font-size: 70px; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920">
      <div id="fundo" class="camada">
        <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
        <svg id="campo" viewBox="0 0 740 1100" fill="none" stroke="#fff" stroke-width="4">
          <rect x="20" y="20" width="700" height="1060" /><line x1="20" y1="550" x2="720" y2="550" />
          <circle cx="370" cy="550" r="95" /><circle cx="370" cy="550" r="6" fill="#fff" />
          <rect x="190" y="20" width="360" height="160" /><rect x="280" y="20" width="180" height="60" />
          <path d="M300 180a70 70 0 0 0 140 0" />
          <rect x="190" y="920" width="360" height="160" /><rect x="280" y="1020" width="180" height="60" />
          <path d="M300 920a70 70 0 0 1 140 0" />
        </svg>
        <div id="faixas"><div class="raio" id="r1"></div><div class="raio" id="r2"></div></div>
      </div>
      <div id="camera">
        <section id="gancho" class="cena"></section>
        <section id="intro" class="cena"></section>
        <section id="principal" class="cena">
          <div id="gigante">GOL</div>
          <div id="placar"></div>
          <div id="palco"></div>
          <div id="barra">
            <div id="marcas"></div>
            <div id="trilho"><div id="enche"></div></div>
            <div id="cabeca"></div>
            <div id="momentum"><div class="eixo"></div><div id="mom-revela"></div></div>
          </div>
        </section>
        <section id="fim" class="cena"></section>
        <div id="particulas" class="camada"></div>
      </div>
      <div id="vermelho" class="camada"></div>
      <div id="flash" class="camada"></div>
      <div id="wipe" class="camada"><div class="painel" id="w1"></div><div class="painel" id="w2"></div><div class="painel" id="w3"></div></div>
      <div id="grao" class="camada"></div>
      <div id="vinheta" class="camada"></div>
      <div id="progresso"></div>
    </div>
    <script>
      const D = /*__DADOS__*/null;
      const J = D.jogo, A = D.agenda, M = A.m, ACR = J.acrescimos;
      const root = document.getElementById("root");
      const COR = { casa: J.casa.destaque, fora: J.fora.destaque };
      root.style.setProperty("--casa", COR.casa);
      root.style.setProperty("--fora", COR.fora);
      const BAR_W = 840;
      const $ = (id) => document.getElementById(id);

      // ---------- utilitários ----------
      function h(tag, cls, html, pai) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        if (pai) pai.appendChild(e);
        return e;
      }
      function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
      function escudo(lado, cls, pai) {
        const box = h("div", cls, null, pai);
        const t = J[lado];
        if (t.escudo) h("img", "escudo", null, box).src = t.escudo;
        else h("div", "escudo-alt", esc(t.sigla), box);
        return box;
      }
      // texto dentro de uma máscara, para revelar de baixo para cima
      function mascara(tag, cls, html, pai) {
        const m = h("div", "mascara", null, pai);
        return h(tag, cls, html, m);
      }
      function minTxt(m, a) { return a ? `${m}+${a}'` : `${m}'`; }
      function posicao(m, a) {
        const l1 = 45 + ACR[0], l2 = 45 + ACR[1], tot = l1 + l2;
        if (m <= 45) return Math.min(m + a, l1) / tot;
        return (l1 + Math.min(m - 45 + a, l2)) / tot;
      }
      // inversa de power2.inOut, para saber quando a barra cruza cada minuto
      function invEase(y) { return y < 0.5 ? Math.sqrt(y / 2) : 1 - Math.sqrt((1 - y) / 2); }
      // aleatório determinístico (o render precisa ser reproduzível)
      function prng(seed) {
        return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      }

      const ICONES = {
        gol: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff"/><polygon points="50,30 69,44 62,66 38,66 31,44" fill="#111"/><path d="M50 30V6M69 44l22-8M62 66l14 20M38 66L24 86M31 44L9 36" stroke="#111" stroke-width="5"/></svg>`,
        amarelo: `<svg viewBox="0 0 100 100"><rect x="24" y="8" width="52" height="84" rx="8" fill="#facc15" transform="rotate(8 50 50)"/></svg>`,
        vermelho: `<svg viewBox="0 0 100 100"><rect x="24" y="8" width="52" height="84" rx="8" fill="#ef4444" transform="rotate(8 50 50)"/></svg>`,
        chance: `<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="7"><circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="22"/><circle cx="50" cy="50" r="5" fill="#fff"/></svg>`,
        penalti_perdido: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="7"/><path d="M28 28l44 44M72 28L28 72" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/></svg>`,
        anulado: `<svg viewBox="0 0 100 100"><rect x="6" y="20" width="88" height="60" rx="10" fill="none" stroke="#fff" stroke-width="7"/><text x="50" y="63" text-anchor="middle" font-family="Barlow" font-weight="800" font-size="34" fill="#fff">VAR</text></svg>`,
      };
      const ROTULOS = { gol: "GOL", vermelho: "EXPULSO", amarelo: "AMARELO", chance: "QUASE!", penalti_perdido: "PÊNALTI PERDIDO", anulado: "GOL ANULADO" };

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      const T = A.total;
      const CAM = $("camera"), FLASH = $("flash");

      // ---------- efeitos reutilizáveis ----------
      function tremor(t, forca, dur, seed) {
        const r = prng(seed), passos = Math.round(dur / 0.04);
        for (let i = 0; i < passos; i++) {
          const k = forca * (1 - i / passos);
          tl.to(CAM, { x: (r() - 0.5) * 2 * k, y: (r() - 0.5) * 2 * k, rotation: (r() - 0.5) * k * 0.04, duration: 0.04, ease: "none" }, t + i * 0.04);
        }
        tl.to(CAM, { x: 0, y: 0, rotation: 0, duration: 0.06, ease: "power1.out" }, t + passos * 0.04);
      }
      function soco(t, escala) {

            const tt = t0 + dur * (1 - Math.sqrt(1 - frac)); // inversa de power2.out
            tl.set(pcts[k - 1], { opacity: 0 }, tt);
            tl.set(s, { opacity: 1 }, tt);
          });
        }
        // saída
        tl.to(c, { x: -320, skewX: 10, opacity: 0, duration: 0.4, ease: "power3.in" }, parada.saida);

        // placar só muda quando o gol é atingido
        if (d.tipo === "gol") {
          const lado = d.time === "casa" ? 0 : 1;
          const caixa = lado === 0 ? numC : numF;
          const antes = caixa.children[placarAtual[lado]], depois = caixa.children[d.placar[lado]];
          placarAtual[0] = d.placar[0]; placarAtual[1] = d.placar[1];
          if (antes !== depois) {
            tl.to(antes, { opacity: 0, y: -120, duration: 0.22, ease: "power2.in" }, parada.placar - 0.22);
            tl.fromTo(depois, { opacity: 0, y: 140 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2.2)", immediateRender: false }, parada.placar);
            tl.fromTo(caixa, { scale: 1.45 }, { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.5)", immediateRender: false }, parada.placar);
            tl.fromTo(depois, { textShadow: `0 0 60px ${cor}` }, { textShadow: "0 0 0px rgba(0,0,0,0)", duration: 1.4, immediateRender: false }, parada.placar);
          }
        }
        tempo = t + A.card;
      });
      viagem(pos, 1, tempo, A.trecho_final);
      tl.set(spans[ultimo], { opacity: 0 }, A.fim_barra);
      tl.set(spanFim, { opacity: 1 }, A.fim_barra);
      tl.fromTo(relogio, { scale: 1 }, { scale: 1.25, duration: 0.18, yoyo: true, repeat: 3, immediateRender: false }, M.apito_final);
      tl.fromTo(CABECA, { scale: 1, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.6, immediateRender: false }, M.apito_final);
      wipe(M.wipe3);
      tl.set(P, { opacity: 0 }, M.fim);

      // ---------- fim ----------
      const F = $("fim");
      const tit = h("div", "titulo", "FIM DE JOGO", F);
      const fin = h("div", "final", null, F);
      const fc = escudo("casa", "img", fin);
      const gols = h("div", "gols", `<span>${J.placar[0]}</span><span class="x">×</span><span>${J.placar[1]}</span>`, fin);
      const ff = escudo("fora", "img", fin);
      const S = D.estatisticas || {};
      const linhas = [["posse", "Posse", (v) => Math.round(v) + "%"], ["finalizacoes", "Finalizações", (v) => Math.round(v)],
        ["no_gol", "No gol", (v) => Math.round(v)], ["xg", "Gols esperados (xG)", (v) => v.toFixed(2)], ["chances_claras", "Chances claras", (v) => Math.round(v)]];
      const st = h("div", "stats", null, F);
      const linhasEl = [];
      linhas.forEach(([k, nome, fmt]) => {
        const v = S[k];
        if (!v || v[0] == null || v[1] == null) return;
        const l = h("div", "linha", null, st);
        h("div", "nums", `<span>${fmt(v[0])}</span><span class="nome">${nome}</span><span>${fmt(v[1])}</span>`, l);
        const b = h("div", "barras", null, l);
        const tot = v[0] + v[1] || 1;
        const bc = h("div", "bc", null, b), bf = h("div", "bf", null, b);
        bc.style.flex = String(Math.max(0.02, v[0] / tot)); bf.style.flex = String(Math.max(0.02, v[1] / tot));
        linhasEl.push([l, bc, bf]);
      });
      const cta = h("div", "cta", `<span>${D.proximo ? `Próximo jogo da rodada:<br><b>${esc(D.proximo)}</b>` : `Segue pra ver os outros<br>jogos da <b>rodada ${esc(J.rodada)}</b>`}</span>`, F);
      const seta = h("div", "seta", "→", cta);
      const f0 = M.fim;
      tl.set(F, { opacity: 1 }, f0);
      tl.fromTo(tit, { scale: 2.6, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.3, ease: "power4.out" }, f0 - 0.15);
      tremor(f0 + 0.1, 20, 0.25, 400);
      tl.fromTo(fc, { x: -500, rotation: -30, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, M.fim_placar - 0.25);
      tl.fromTo(ff, { x: 500, rotation: 30, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, M.fim_placar - 0.25);
      tl.fromTo(gols, { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, M.fim_placar - 0.2);
      tremor(M.fim_placar + 0.1, 30, 0.35, 401);
      clarao(M.fim_placar + 0.1, "#ffffff", 0.3, 0.4);
      const [hc, ha] = J.placar;
      if (hc !== ha) {
        const venc = hc > ha ? fc : ff, perd = hc > ha ? ff : fc, corV = hc > ha ? COR.casa : COR.fora;
        tl.fromTo(perd, { opacity: 1, filter: "grayscale(0)" }, { opacity: 0.45, filter: "grayscale(1)", duration: 0.8, immediateRender: false }, M.fim_placar + 0.6);
        tl.fromTo(venc, { scale: 1 }, { scale: 1.14, duration: 0.7, yoyo: true, repeat: Math.max(1, Math.floor((T - M.fim_placar - 1) / 0.7)), ease: "sine.inOut", immediateRender: false }, M.fim_placar + 0.6);
        confete(M.fim_placar + 0.1, [corV, "#ffffff"], hc > ha ? 220 : 860, 520, 40, 500);
      }
      linhasEl.forEach(([l, bc, bf], i) => {
        const t = M.fim_stats[i];
        tl.fromTo(l, { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t);
        tl.to([bc, bf], { scaleX: 1, duration: 0.7, ease: "power2.out" }, t + 0.1);
      });
      tl.fromTo(cta, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)", immediateRender: false }, M.cta);
      tl.fromTo(seta, { x: 0 }, { x: 18, duration: 0.35, yoyo: true, repeat: Math.max(1, Math.floor((T - M.cta - 0.5) / 0.35)), ease: "sine.inOut", immediateRender: false }, M.cta + 0.4);
      tl.fromTo(cta, { borderColor: "rgba(255,255,255,0.14)" }, { borderColor: "rgba(255,255,255,0.8)", duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor((T - M.cta - 0.5) / 0.6)), immediateRender: false }, M.cta + 0.5);
      tl.set({}, {}, T);
      tl.seek(0);
    </script>
  </body>
