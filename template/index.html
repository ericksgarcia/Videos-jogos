<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>

    <script src="assets/gsap.min.js"></script>
    <style>

      @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/barlow-700.woff2") format("woff2"); }

      .camada { position: absolute; inset: 0; pointer-events: none; }

      /* ---------- fundo vivo ---------- */
      .blob { position: absolute; width: 1500px; height: 1500px; border-radius: 50%; }

      #b2 { left: 300px; top: 1000px; background: radial-gradient(closest-side, color-mix(in srgb, var(--fora) 30%, transparent), transparent); }
      #b3 { left: 100px; top: 300px; width: 1100px; height: 1100px; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.05), transparent); }
      #campo-fundo { position: absolute; left: -200px; top: 200px; width: 1480px; height: 1800px; opacity: 0.07; }
      #faixas { position: absolute; inset: 0; overflow: hidden; }

      #camera { position: absolute; inset: 0; transform-origin: 540px 900px; }

      .mascara { overflow: hidden; display: block; }

      #flash { position: absolute; inset: 0; opacity: 0; background: #fff; }

      #wipe { position: absolute; inset: 0; overflow: hidden; }

        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>");
      }
      #vinheta { position: absolute; inset: 0; background: radial-gradient(130% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.65)); }

      /* ---------- gancho ---------- */
      #gancho { display: flex; flex-direction: column; justify-content: center; padding: 0 80px 300px; transform-origin: 300px 900px; }
      #gancho .laje { position: absolute; left: -100px; top: 640px; width: 1300px; height: 520px; transform-origin: left center; transform: skewY(-7deg); background: linear-gradient(90deg, color-mix(in srgb, var(--casa) 30%, transparent), color-mix(in srgb, var(--fora) 30%, transparent)); }
      #gancho .tag { position: relative; font-weight: 700; font-size: 46px; letter-spacing: 0.14em; color: var(--suave); text-transform: uppercase; }

      #gancho h1 .w { display: inline-block; margin-right: 0.18em; transform-origin: center 60%; }
      #gancho .eco { position: absolute; left: 80px; top: 0; bottom: 300px; display: flex; align-items: center; font-weight: 800; font-size: 190px; line-height: 0.9; text-transform: uppercase; color: transparent; -webkit-text-stroke: 3px rgba(255, 255, 255, 0.18); opacity: 0; transform-origin: left center; }
      #gancho p { position: relative; font-weight: 500; font-size: 58px; line-height: 1.15; color: #d4d4d8; }

      /* ---------- intro ---------- */
      #intro { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 260px; }
      #intro .duelo { position: relative; display: flex; align-items: center; gap: 50px; }
      #intro .time { width: 340px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
      #intro .time .img { width: 290px; height: 290px; font-size: 290px; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6)); }
      #intro .time .nome { font-weight: 800; font-size: 78px; text-transform: uppercase; text-align: center; line-height: 1; }
      #intro .vs { position: relative; font-weight: 800; font-size: 120px; font-style: italic; color: var(--texto); text-shadow: 0 0 40px rgba(255, 255, 255, 0.5); }
      #intro .anel { position: absolute; left: 50%; top: 50%; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%; border: 8px solid #fff; opacity: 0; }

      #relogio .periodo span { position: absolute; left: 0; right: 0; opacity: 0; }
      #relogio .min { position: relative; height: 250px; margin-top: 70px; }

      #relogio .ao-vivo { position: absolute; left: 50%; top: 4px; margin-left: -230px; width: 18px; height: 18px; border-radius: 50%; background: #ef4444; }

      #barra { position: absolute; top: 960px; left: 80px; width: 840px; height: 440px; }
      #marcas { position: absolute; left: 0; top: 0; width: 840px; height: 150px; }

      .marca.r0 { top: 82px; }

      #enche { position: absolute; inset: 0; background: linear-gradient(90deg, var(--casa), var(--fora)); transform-origin: left center; transform: scaleX(0); }
      #cabeca { position: absolute; left: 0; top: 171px; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: #fff; box-shadow: 0 0 30px 10px rgba(255, 255, 255, 0.55); }
      .tique { position: absolute; top: 152px; width: 4px; height: 38px; margin-left: -2px; background: var(--texto); opacity: 0.5; }

      .onda { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 6px solid var(--cor); opacity: 0; }
      #momentum { position: absolute; left: 0; top: 270px; width: 840px; height: 160px; }
      #mom-revela { position: absolute; left: 0; top: 0; height: 160px; width: 0; overflow: hidden; }
      #momentum svg { position: absolute; left: 0; top: 0; }
      #momentum .eixo { position: absolute; left: 0; top: 79px; width: 840px; height: 2px; background: var(--linha); }
      #momentum .leg-t { position: absolute; left: -64px; width: 44px; height: 44px; font-size: 44px; }

      /* ---------- tela do lance ---------- */
      .lance { transform-origin: 540px 900px; }
      .lance .topo { position: absolute; top: 150px; left: 60px; width: 900px; height: 150px; display: flex; align-items: center; gap: 26px; }
      .lance .tipo { font-weight: 800; font-size: 64px; letter-spacing: 0.04em; padding: 8px 30px; border-radius: 18px; background: var(--cor); color: var(--sobre-cor); }
      .lance .minuto { font-weight: 800; font-size: 96px; line-height: 1; }
      .lance .mini { margin-left: auto; display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 64px; padding: 10px 22px; border-radius: 22px; background: rgba(255, 255, 255, 0.08); border: 2px solid var(--linha); }
      .lance .mini .img { width: 60px; height: 60px; font-size: 60px; }
      .lance .mini .num { width: 40px; height: 70px; }
      .lance .mini .num span { line-height: 70px; }
      .lance .jog { position: absolute; top: 330px; left: 60px; width: 900px; height: 260px; display: flex; align-items: center; gap: 40px; }
      .lance .foto { position: relative; width: 240px; height: 240px; flex: none; border-radius: 50%; padding: 10px; background: conic-gradient(var(--cor), color-mix(in srgb, var(--cor) 30%, transparent), var(--cor)); }
      .lance .foto .dentro { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #1c2230; display: flex; align-items: flex-end; justify-content: center; }
      .lance .foto img.jogador { width: 100%; height: 100%; object-fit: cover; }
      .lance .foto .esc-foto { width: 70%; height: 70%; margin-bottom: 15%; font-size: 150px; }
      .lance .foto .selo { position: absolute; right: -6px; bottom: -6px; width: 84px; height: 84px; font-size: 84px; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.6)); }
      .lance .nome { font-weight: 800; font-size: 92px; line-height: 1; }
      .lance .time-nome { font-weight: 700; font-size: 46px; color: var(--suave); margin-top: 14px; text-transform: uppercase; letter-spacing: 0.08em; }
      .lance .area { position: absolute; top: 620px; left: 100px; width: 880px; height: 700px; }
      .lance .chips { position: absolute; top: 1345px; left: 60px; width: 960px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
      .lance .chip { font-weight: 700; font-size: 38px; padding: 8px 22px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); border: 2px solid var(--linha); }
      .lance .leg { position: absolute; top: 1440px; left: 50px; width: 980px; height: 190px; }
      .bloco { position: absolute; inset: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 0 22px; opacity: 0; }
      .bloco span { display: inline-block; font-weight: 800; font-size: 74px; line-height: 1.12; text-transform: uppercase; color: #fff; -webkit-text-stroke: 12px #000; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0, 0, 0, 0.7); }

      .area3d { perspective: 1500px; perspective-origin: 50% 88%; overflow: hidden; border-radius: 26px; }
      .tilt { position: absolute; inset: 0; transform-style: preserve-3d; }
      .plano { position: absolute; left: 0; width: 880px; transform-style: preserve-3d; }
      .bola3d { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; opacity: 0; }
      .bola3d .bola { opacity: 1; }
      .rastro { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
      .rastro div { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px 7px var(--cor), 0 0 4px 2px #fff; opacity: 0; }
      .trave3d { position: absolute; transform-origin: 50% 100%; transform: rotateX(-90deg); border: 5px solid #fff; border-bottom: none; box-shadow: 0 0 12px rgba(255,255,255,0.6); }
      .trave3d .rede { position: absolute; inset: 0; transform-origin: 50% 100%; background-color: rgba(255,255,255,0.10); background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.35) 0 1px, transparent 1px 6px), repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0 1px, transparent 1px 6px); }
      .goleiro3d { position: absolute; transform-origin: 50% 100%; transform: rotateX(-90deg); border-radius: 10px 10px 4px 4px; background: var(--cor); border: 3px solid #fff; }
      .gramado { position: absolute; left: 0; top: 0; border-radius: 22px; overflow: hidden; }
      .entorno { position: absolute; left: -1600px; top: -1600px; width: 4080px; background: radial-gradient(closest-side, #14532d, #0b2e1a 70%, #07140d); }
      .placas { position: absolute; left: -500px; width: 1880px; display: flex; gap: 0; transform-origin: 50% 100%; transform: rotateX(-90deg); background: linear-gradient(90deg, var(--casa), var(--fora), var(--casa), var(--fora)); overflow: hidden; }
      .placas span { flex: 1; font-weight: 800; font-size: 10px; line-height: 13px; text-align: center; color: #fff; text-shadow: 0 0 2px #000; white-space: nowrap; }
      .arquibancada { position: absolute; left: -900px; width: 2680px; transform-origin: 50% 100%; transform: rotateX(-90deg); background: radial-gradient(circle at 3px 3px, rgba(255,255,255,0.55) 0 1.4px, transparent 2px) 0 0 / 7px 6px, linear-gradient(#0b0f1a, #1f2937); }
      .gramado svg { display: block; }
      .linha-c { fill: none; stroke: rgba(255, 255, 255, 0.75); stroke-width: 4; }
      .bola { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #d4d4d8 70%); box-shadow: 0 0 22px 6px rgba(255, 255, 255, 0.55); opacity: 0; }
      .atleta { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 4px solid #fff; background: var(--cor); opacity: 0; }
      .atleta .rotulo { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); white-space: nowrap; font-weight: 700; font-size: 30px; color: #fff; -webkit-text-stroke: 6px rgba(0, 0, 0, 0.85); paint-order: stroke fill; }
      .goleiro { --cor: #e5e7eb; }
      .carimbo { position: absolute; left: 0; right: 0; top: 260px; text-align: center; font-weight: 800; font-size: 170px; line-height: 1; color: #fff; -webkit-text-stroke: 14px var(--cor); paint-order: stroke fill; opacity: 0; transform: rotate(-6deg); text-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
      .cartao-g { position: absolute; left: 290px; top: 70px; width: 300px; height: 440px; border-radius: 30px; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6); opacity: 0; }
      .cartao-g::after { content: ""; position: absolute; inset: 0; border-radius: 30px; background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), transparent 45%); }
      .onze { position: absolute; left: 0; right: 0; top: 560px; display: flex; justify-content: center; gap: 18px; }
      .onze div { width: 52px; height: 52px; border-radius: 50%; background: var(--cor); border: 4px solid #fff; opacity: 0; }
      .fica { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font-weight: 800; font-size: 54px; opacity: 0; }
      .var-tela { position: absolute; left: 140px; top: 110px; width: 600px; height: 380px; border-radius: 24px; border: 10px solid #e5e7eb; background: #0f172a; overflow: hidden; opacity: 0; }

      #particulas { position: absolute; inset: 0; }

      /* ---------- fim ---------- */
      #fim { display: flex; flex-direction: column; align-items: center; padding: 190px 80px 0; }
      #fim .titulo { font-weight: 800; font-size: 96px; letter-spacing: 0.08em; padding: 6px 36px; border: 8px solid var(--texto); border-radius: 18px; transform: rotate(-3deg); }

      #fim .linha .nums { display: flex; justify-content: space-between; font-weight: 800; font-size: 58px; gap: 0; }
      #fim .linha .nums .nome { font-weight: 700; font-size: 40px; color: var(--suave); text-transform: uppercase; letter-spacing: 0.06em; align-self: center; }

      #fim .cta b { font-weight: 800; }

  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920">
      <div id="fundo" class="camada">
        <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
        <svg id="campo-fundo" viewBox="0 0 740 1100" fill="none" stroke="#fff" stroke-width="4">
          <rect x="20" y="20" width="700" height="1060" /><line x1="20" y1="550" x2="720" y2="550" />
          <circle cx="370" cy="550" r="95" /><circle cx="370" cy="550" r="6" fill="#fff" />
          <rect x="190" y="20" width="360" height="160" /><rect x="280" y="20" width="180" height="60" />
          <path d="M300 180a70 70 0 0 0 140 0" />
          <rect x="190" y="920" width="360" height="160" /><rect x="280" y="1020" width="180" height="60" />
          <path d="M300 920a70 70 0 0 1 140 0" />
        </svg>
        <div id="faixas"><div class="raio" id="r1"></div><div class="raio" id="r2"></div></div>
      </div>
      <div id="camera">
        <section id="gancho" class="cena"></section>
        <section id="intro" class="cena"></section>
        <section id="principal" class="cena">
          <div id="placar"></div>
          <div id="relogio"><div class="periodo"></div><div class="min"></div></div>
          <div id="barra">
            <div id="marcas"></div>
            <div id="trilho"><div id="enche"></div></div>
            <div id="cabeca"></div>
            <div id="momentum"><div class="eixo"></div><div id="mom-revela"></div></div>
          </div>
        </section>
        <div id="lances"></div>
        <section id="fim" class="cena"></section>
        <div id="particulas" class="camada"></div>
      </div>
      <div id="vermelho" class="camada"></div>
      <div id="flash" class="camada"></div>
      <div id="wipe" class="camada"><div class="painel" id="w1"></div><div class="painel" id="w2"></div><div class="painel" id="w3"></div></div>
      <div id="grao" class="camada"></div>
      <div id="vinheta" class="camada"></div>
      <div id="progresso"></div>
    </div>
    <script>
      const D = /*__DADOS__*/null;
      const J = D.jogo, A = D.agenda, M = A.m, ACR = J.acrescimos;
      const root = document.getElementById("root");
      const COR = { casa: J.casa.destaque, fora: J.fora.destaque };

          tremor(C + 0.3, d.tipo === "vermelho" ? 24 : 12, 0.3, 200 + i);
          soco(C + 0.3, 1.03);
          if (d.tipo === "vermelho") {
            tl.fromTo("#vermelho", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, C + 0.3);
            tl.to("#vermelho", { opacity: 0, duration: 1.2, ease: "power2.out" }, C + 0.5);
            const onze = h("div", "onze", null, area);
            const bolas = Array.from({ length: 11 }, () => h("div", null, null, onze));
            const n = D.destaques.filter((x, j) => j <= i && x.tipo === "vermelho" && x.time === d.time).length;
            tl.fromTo(bolas, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.04, ease: "back.out(2)" }, S + 0.8);
            for (let k = 0; k < n; k++) tl.to(bolas[10 - k], { y: 140, opacity: 0, rotation: 90, duration: 0.6, ease: "power2.in" }, C + 0.8);
            const fica = h("div", "fica", `${esc(J[d.time].nome)} com ${11 - n}`, area);
            tl.fromTo(fica, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, C + 1.1);
          }
        } else {
          const vt = h("div", "var-tela", null, area);
          h("div", "t", "VAR", vt);
          const scan = h("div", "scan", null, vt);
          tl.fromTo(vt, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }, S + 0.5);
          tl.fromTo(scan, { y: -60 }, { y: 380, duration: 1.0, repeat: Math.max(1, Math.floor((C - S - 0.5) / 1.0)), ease: "none", immediateRender: false }, S + 0.6);
          const carimbo = h("div", "carimbo", d.tipo === "anulado" ? "ANULADO" : "PERDIDO", area);
          carimbo.style.setProperty("--cor", "#ef4444");
          tl.fromTo(carimbo, { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" }, C);
          tremor(C, 18, 0.3, 100 + i);
        }

        // volta para a barra
        wipe(pa.wipe);
        tl.set(L, { opacity: 0 }, E);
        tl.set(P, { scale: 1, opacity: 1 }, E);
        if (d.tipo === "gol") {
          const lado = d.time === "casa" ? 0 : 1;
          virarDigito(caixasBarra[lado], placarAtual[lado], d.placar[lado], pa.placar, cor);
          placarAtual[0] = d.placar[0]; placarAtual[1] = d.placar[1];
        }
        tempo = E + 0.35;
      });
      viagem(pos, 1, tempo, A.trecho_final);
      tl.set(spans[ultimo], { opacity: 0 }, A.fim_barra);
      tl.set(spanFim, { opacity: 1 }, A.fim_barra);
      tl.fromTo(REL, { scale: 1 }, { scale: 1.15, duration: 0.18, yoyo: true, repeat: 3, immediateRender: false }, M.apito_final);
      tl.fromTo(CABECA, { scale: 1, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 0.6, immediateRender: false }, M.apito_final);
      wipe(M.wipe3);
      tl.set(P, { opacity: 0 }, M.fim);

      // ---------- fim ----------
      const F = $("fim");
      const tit = h("div", "titulo", "FIM DE JOGO", F);
      const fin = h("div", "final", null, F);
      const fc = escudo("casa", "img", fin);
      const gols = h("div", "gols", `<span>${J.placar[0]}</span><span class="x">×</span><span>${J.placar[1]}</span>`, fin);
      const ff = escudo("fora", "img", fin);
      const S_ = D.estatisticas || {};
      const linhas = [["posse", "Posse", (v) => Math.round(v) + "%"], ["finalizacoes", "Finalizações", (v) => Math.round(v)],
        ["no_gol", "No gol", (v) => Math.round(v)], ["chances_claras", "Chances claras", (v) => Math.round(v)]];
      const st = h("div", "stats", null, F);
      const linhasEl = [];
      linhas.forEach(([k, nome, fmt]) => {
        const v = S_[k];
        if (!v || v[0] == null || v[1] == null) return;
        const l = h("div", "linha", null, st);
        h("div", "nums", `<span>${fmt(v[0])}</span><span class="nome">${nome}</span><span>${fmt(v[1])}</span>`, l);
        const b = h("div", "barras", null, l);
        const tot = v[0] + v[1] || 1;
        const bc = h("div", "bc", null, b), bf = h("div", "bf", null, b);
        bc.style.flex = String(Math.max(0.02, v[0] / tot)); bf.style.flex = String(Math.max(0.02, v[1] / tot));
        linhasEl.push([l, bc, bf]);
      });
      const cta = h("div", "cta", `<span>${D.proximo ? `Próximo jogo da rodada:<br><b>${esc(D.proximo)}</b>` : `Segue pra ver os outros<br>jogos da <b>rodada ${esc(J.rodada)}</b>`}</span>`, F);
      const seta = h("div", "seta", "→", cta);
      const f0 = M.fim;
      tl.set(F, { opacity: 1 }, f0);
      tl.fromTo(tit, { scale: 2.6, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.3, ease: "power4.out" }, f0 - 0.15);
      tremor(f0 + 0.1, 20, 0.25, 400);
      tl.fromTo(fc, { x: -500, rotation: -30, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, M.fim_placar - 0.25);
      tl.fromTo(ff, { x: 500, rotation: 30, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, M.fim_placar - 0.25);
      tl.fromTo(gols, { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, M.fim_placar - 0.2);
      tremor(M.fim_placar + 0.1, 30, 0.35, 401);
      clarao(M.fim_placar + 0.1, "#ffffff", 0.3, 0.4);
      const [hc, ha] = J.placar;
      if (hc !== ha) {
        const venc = hc > ha ? fc : ff, perd = hc > ha ? ff : fc, corV = hc > ha ? COR.casa : COR.fora;
        tl.fromTo(perd, { opacity: 1, filter: "grayscale(0)" }, { opacity: 0.45, filter: "grayscale(1)", duration: 0.8, immediateRender: false }, M.fim_placar + 0.6);
        tl.fromTo(venc, { scale: 1 }, { scale: 1.14, duration: 0.7, yoyo: true, repeat: Math.max(1, Math.floor((T - M.fim_placar - 1) / 0.7)), ease: "sine.inOut", immediateRender: false }, M.fim_placar + 0.6);
        confete(M.fim_placar + 0.1, [corV, "#ffffff"], hc > ha ? 220 : 860, 520, 40, 500);
      }
      linhasEl.forEach(([l, bc, bf], i) => {
        const t = M.fim_stats[i];
        tl.fromTo(l, { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t);
        tl.to([bc, bf], { scaleX: 1, duration: 0.7, ease: "power2.out" }, t + 0.1);
      });
      tl.fromTo(cta, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)", immediateRender: false }, M.cta);
      tl.fromTo(seta, { x: 0 }, { x: 18, duration: 0.35, yoyo: true, repeat: Math.max(1, Math.floor((T - M.cta - 0.5) / 0.35)), ease: "sine.inOut", immediateRender: false }, M.cta + 0.4);
      tl.fromTo(cta, { borderColor: "rgba(255,255,255,0.14)" }, { borderColor: "rgba(255,255,255,0.8)", duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor((T - M.cta - 0.5) / 0.6)), immediateRender: false }, M.cta + 0.5);
      tl.set({}, {}, T);
      tl.seek(0);
    </script>
  </body>
